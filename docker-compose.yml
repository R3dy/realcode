# docker-compose.yml -- realcode dev deployment (ADR-003 + ADR-006)
# Three services: engine (long-running dispatch loop), dashboard (Next.js),
# and Phoenix (OTel collector for traces).
#
# Usage:
#   docker compose up -d              # start all services
#   docker compose logs -f engine    # watch engine logs
#   docker compose down              # stop
#
# The dev backend uses SQLite (file-based) + FileStorage (filesystem).
# Data persists in the mounted ./data volume.

services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realcode-engine
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - ANYMAKE_MODEL_TIER1=${ANYMAKE_MODEL_TIER1:-openrouter/z-ai/glm-5.2}
      - ANYMAKE_MODEL_TIER2=${ANYMAKE_MODEL_TIER2:-openrouter/z-ai/glm-5.2}
      - ANYMAKE_MODEL_TIER3=${ANYMAKE_MODEL_TIER3:-openrouter/z-ai/glm-5.2}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set in .env}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006/v1/traces
      - OTEL_SERVICE_NAME=realcode-engine
      - REALCODE_DATA_DIR=/data
      - REALCODE_HOST_DATA_DIR=${PWD}/data
      - REALCODE_GRAPH=/app/stage-graph.yaml
      - REALCODE_DISPATCH_INTERVAL_MS=${REALCODE_DISPATCH_INTERVAL_MS:-5000}
      - MISSION_CONTROL_ROOT=/mission-control
      - REALCODE_HOST_MISSION_CONTROL_ROOT=${REALCODE_HOST_MISSION_CONTROL_ROOT:-/home/royce/mission-control}
      - REALCODE_OPENCODE_CONFIG_DIR=/root/.config/opencode
      - REALCODE_HOST_OPENCODE_CONFIG_DIR=${REALCODE_HOST_OPENCODE_CONFIG_DIR:-/home/royce/.config/opencode}
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - ${REALCODE_HOST_MISSION_CONTROL_ROOT:-/home/royce/mission-control}:/mission-control:ro
      # Ship-persistence (issue #19): the engine writes shipped net-new projects
      # to PROJECTS/<name>/repo so subsequent [target: <name>] change-flow runs
      # can find + extend them. The parent /mission-control mount is read-only
      # (config/docs); this overlay mount makes just PROJECTS/ read-write.
      - ${REALCODE_HOST_MISSION_CONTROL_ROOT:-/home/royce/mission-control}/PROJECTS:/mission-control/PROJECTS:rw
      - ${REALCODE_HOST_OPENCODE_CONFIG_DIR:-/home/royce/.config/opencode}:/root/.config/opencode:ro
    depends_on:
      phoenix:
        condition: service_started
    networks:
      - realcode-net
    command: ["node", "dist/engine-loop.js"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: realcode-dashboard
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - REALCODE_DATA_DIR=/data
      - REALCODE_GRAPH=/app/stage-graph.yaml
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006/v1/traces
      - MISSION_CONTROL_ROOT=/mission-control
    volumes:
      - ./data:/data
      - ${REALCODE_HOST_MISSION_CONTROL_ROOT:-/home/royce/mission-control}:/mission-control:ro
    depends_on:
      - engine
    networks:
      - realcode-net

  # Sandbox image build target (A4.3). Under a build-only profile so
  # `docker compose up` does NOT start it — build via
  # `docker compose build sandbox`. The engine spawns sibling containers from
  # this image at runtime via docker-in-docker (docker.sock mounted).
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: realcode-sandbox:latest
    profiles:
      - build-only

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: realcode-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"
    volumes:
      - phoenix-data:/data
    networks:
      - realcode-net

volumes:
  phoenix-data:

networks:
  realcode-net:
    driver: bridge
