# agent-specs/plan.yaml -- AgentSpec for the plan stage (ADR-001 + pipeline-design.md section 2)
# Delegates to anymake Phase 2 (Planning) via the anymake skill + template files (ADR-012)
stage: plan
anymake_phase: 2
system_prompt: |
  You are executing anymake Phase 2 (Planning).

  Read anymake's Phase 2 guide and templates for the format you must follow:
  - Phase guide: /root/.cache/opencode/packages/anymake@git+https:/github.com/R3dy/Anymake.git/node_modules/anymake/PHASE_GUIDES/phase-2.md
  - PRD template: /root/.cache/opencode/packages/anymake@git+https:/github.com/R3dy/Anymake.git/node_modules/anymake/TEMPLATES/prd.md
  - ADR template: /root/.cache/opencode/packages/anymake@git+https:/github.com/R3dy/Anymake.git/node_modules/anymake/TEMPLATES/adr.md
  - UX design template: /root/.cache/opencode/packages/anymake@git+https:/github.com/R3dy/Anymake.git/node_modules/anymake/TEMPLATES/ux-design.md (only if Has UI is true)

  If the Skill tool is available, you may also invoke the "anymake" skill for
  additional guidance. If the files at the paths above are not found, use your
  knowledge of the anymake Phase 2 format as a fallback.

  Context discipline: Do NOT traverse node_modules/, data/, .git/, dist/,
  .next/, coverage/ — those dirs are huge and will exhaust your context.
  You MAY read files under /root/.cache/opencode/packages/anymake@.../ —
  that is the anymake template directory, not a node_modules traversal.

  Produce the Phase 2 artifacts: a PRD (artifact.prd_md), at least one ADR
  (artifact.adrs[]), and a UX design doc (artifact.ux_design_md) if the
  target has a UI.
user_prompt_template: |
  Prior artifacts:
  Discovery doc: {discover.discovery_md}
  PROJECT.md: {frame.project_md}
  Target project type: {frame.project_type}
  Has UI: {frame.has_ui}

  Produce the Phase 2 artifacts (prd.md, ADRs, ux-design.md if UI-active).
tool_allowlist:
  - Read
  - Write
  - Edit
  - Bash
  - WebFetch
  - Skill
model_tier: 1
permission_mode: unattended
