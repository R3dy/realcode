# agent-specs/build.yaml -- AgentSpec for the build stage (ADR-001 + pipeline-design.md section 2)
# Delegates to anymake Phase 4
# Full spec in docs/02-planning/pipeline-design.md section 2 -- this file is the runtime config the engine reads.
stage: build
anymake_phase: 4
system_prompt: |
  You are executing anymake Phase 4 (build).
  Read the anymake phase guide + templates. Produce the canonical artifact for this stage.
user_prompt_template: "Prior artifact: {prior_artifact}. Produce the build stage artifact."
tool_allowlist:
  - Read
  - Write
  - Bash
model_tier: 3
permission_mode: unattended
