# agent-specs/frame.yaml -- AgentSpec for the frame stage (ADR-001 + pipeline-design.md section 2)
# Delegates to anymake Phase 0
# Full spec in docs/02-planning/pipeline-design.md section 2 -- this file is the runtime config the engine reads.
stage: frame
anymake_phase: 0
system_prompt: |
  You are executing anymake Phase 0 (frame).
  Read the anymake phase guide + templates. Produce the canonical artifact for this stage.
user_prompt_template: "Prior artifact: {prior_artifact}. Produce the frame stage artifact."
tool_allowlist:
  - Read
  - Write
  - Bash
model_tier: 1
permission_mode: unattended
